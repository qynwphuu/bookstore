# afterchange, cd .., ./mvnw package -DskipTests, cd target, scp .\bookstore-0.0.1-SNAPSHOT.jar quyt@softala.haaga-helia.fi:
# run server on remote server: java -jar bookstore-0.0.1-SNAPSHOT.jar

# Application
spring.application.name=bookstore
server.port=7019

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/quyt
spring.datasource.username=quyt
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# REST API
spring.data.rest.base-path=/api

# SQL initialization (optional)
spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

