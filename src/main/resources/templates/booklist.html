<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>

<body>
    <h1>Hello <span sec:authentication="name"></span>!</h1>
    <h2>Books</h2>

    <table border="1">
        <tr>
            <th>Author</th>
            <th>Title</th>
            <th>ISBN</th>
            <th>Year</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>

        <tr th:each="book : ${books}">
            <td th:text="${book.author}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.category != null ? book.category.name : 'Uncategorized'}"></td>
            <td>
                <a sec:authorize="hasAuthority ('ADMIN')" th:href="@{/delete/{id}(id=${book.id})}">Delete |</a> 
                <a th:href="@{/edit/{id}(id=${book.id})}">Edit</a>
            </td>
        </tr>
    </table>
    <br>
    <a href="/add">Add Book</a>
    <br>
    <p></p>
    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Sign Out" />
    </form>

</body>

</html>
